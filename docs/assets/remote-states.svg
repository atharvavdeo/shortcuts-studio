<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img"><title>Proposed command state progression</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2A637B"/></marker></defs><rect width="1000" height="180" rx="12" fill="#F0F5F8"/><rect x="24.0" y="45" width="172.8" height="90" rx="10" fill="#173B55"/><text x="110.4" y="79" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Validate</text><text x="110.4" y="101" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">or reject</text><path d="M198.8 90h18" stroke="#2A637B" stroke-width="2" marker-end="url(#a)"/><rect x="218.8" y="45" width="172.8" height="90" rx="10" fill="#173B55"/><text x="305.20000000000005" y="79" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Journal</text><text x="305.20000000000005" y="101" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Accepted</text><path d="M393.6 90h18" stroke="#2A637B" stroke-width="2" marker-end="url(#a)"/><rect x="413.6" y="45" width="172.8" height="90" rx="10" fill="#173B55"/><text x="500.0" y="79" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Execute</text><text x="500.0" y="101" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Running</text><path d="M588.4000000000001 90h18" stroke="#2A637B" stroke-width="2" marker-end="url(#a)"/><rect x="608.4000000000001" y="45" width="172.8" height="90" rx="10" fill="#173B55"/><text x="694.8000000000001" y="79" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Terminal</text><text x="694.8000000000001" y="101" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">or Interrupted</text><path d="M783.2 90h18" stroke="#2A637B" stroke-width="2" marker-end="url(#a)"/><rect x="803.2" y="45" width="172.8" height="90" rx="10" fill="#173B55"/><text x="889.6" y="79" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Recover status</text><text x="889.6" y="101" fill="white" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">no auto replay</text></svg>
